<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17233d" />
    <meta name="description" content="Solo impromptu, group discussion, and extempore speaking practice." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("speaking-practice.theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")}catch{}</script>
    <link rel="stylesheet" href="/styles.css" />
    <title>Speaking Practice</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#practice" aria-label="Speaking Practice home">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>Speaking Practice</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
        <a class="history-link" href="#history">History <span id="history-count">0</span></a>
      </div>
    </header>
    <main>
      <div id="stage-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="practice" class="practice-shell"></section>
      <section id="history" class="history-section" aria-labelledby="history-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">On this device</p>
            <h2 id="history-title">Practice history</h2>
          </div>
          <p class="history-note">Recordings remain in this browser until you delete them or clear browser data.</p>
        </div>
        <div id="history-list"></div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
